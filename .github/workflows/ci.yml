name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The README install check runs the installer of the tag the README
      # pins; before that tag exists (release prep) it uses this tree's.
      - name: Fetch the release the README pins
        run: |
          tag=$(sed -n 's/^git clone --branch \([^ ]*\) .*/\1/p' README.md)
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}" || echo "README pins $tag, which is not released yet"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # The e2e suite runs this build's hooks under an older build's
      # dispatcher, as after an upgrade in place: the base, and v0.2.0,
      # from before prompts could name their server.
      - name: Build the older builds for the mixed-build check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CGO_ENABLED: "0"
        run: |
          git fetch --no-tags --depth=1 origin "$BASE" tag v0.2.0
          build() {
            mkdir "$RUNNER_TEMP/$2"
            git archive "$1" | tar -x -C "$RUNNER_TEMP/$2"
            (cd "$RUNNER_TEMP/$2" && go build -tags=testvendorhome -o "$RUNNER_TEMP/crosshall-$2" ./cmd/crosshall)
          }
          build "$BASE" base
          build v0.2.0 release
          echo "CROSSHALL_E2E_BASE_BINARY=$RUNNER_TEMP/crosshall-base" >> "$GITHUB_ENV"
          echo "CROSSHALL_E2E_RELEASE_BINARY=$RUNNER_TEMP/crosshall-release" >> "$GITHUB_ENV"
      - name: Repository checks
        env:
          CGO_ENABLED: "0"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci-checks.sh

  checks-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # The README install check runs the installer of the tag the README
      # pins; before that tag exists (release prep) it uses this tree's.
      - name: Fetch the release the README pins
        run: |
          tag=$(sed -n 's/^git clone --branch \([^ ]*\) .*/\1/p' README.md)
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}" || echo "README pins $tag, which is not released yet"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Repository checks
        env:
          CGO_ENABLED: "0"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash scripts/ci-checks.sh
