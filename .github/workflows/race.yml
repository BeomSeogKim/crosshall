name: race

# The race detector makes these packages' tests 14 to 25 times slower
# (every store open runs migrations through the pure-Go SQLite), so it runs
# nightly on main rather than on each pull request.
on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Race detector on the concurrent packages
        env:
          # On Linux the race detector needs cgo.
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout 25m ./internal/dispatch ./internal/appserver ./internal/publish ./internal/store
